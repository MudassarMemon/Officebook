services:
  - type: web
    name: officebook
    env: ruby
    region: ohio
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -p 10000"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
